<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Downbeat">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12101c"/>
      <stop offset="55%" stop-color="#08070c"/>
      <stop offset="100%" stop-color="#0d0a10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff5f1f" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff5f1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="980" cy="150" r="190" fill="url(#glow)"/>

  <!-- the downbeat: rings closing on one instant -->
  <circle cx="980" cy="150" r="104" fill="none" stroke="#262433" stroke-width="1"/>
  <circle cx="980" cy="150" r="78"  fill="none" stroke="#3a3550" stroke-width="1"/>
  <circle cx="980" cy="150" r="52"  fill="none" stroke="#ff5f1f" stroke-width="2"/>
  <circle cx="980" cy="150" r="7"   fill="#ff5f1f"/>

  <!-- four speakers, one line -->
  <g fill="#3ef2a0">
    <rect x="742" y="147" width="26" height="6" rx="3"/>
    <rect x="784" y="147" width="26" height="6" rx="3"/>
    <rect x="826" y="147" width="26" height="6" rx="3"/>
    <rect x="868" y="147" width="26" height="6" rx="3"/>
  </g>

  <text x="80" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="800" letter-spacing="-3" fill="#f2efe9">DOWNBEAT</text>
  <text x="84" y="196" font-family="Georgia, serif" font-style="italic"
        font-size="30" fill="#ff5f1f">everybody on the one</text>
  <text x="84" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="15" letter-spacing="2" fill="#8b879b">ONE SONG · EVERY PHONE · THE SAME MILLISECOND</text>
</svg>
