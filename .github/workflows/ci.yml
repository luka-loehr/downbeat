name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Worker & web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate binding types
        run: npx wrangler types
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  source:
    name: Cloud source (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Check
        working-directory: source
        # --locked: the committed lockfile pins the vergen family to versions
        # that build together; a fresh resolution would not.
        run: cargo check --locked
