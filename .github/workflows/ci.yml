name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Worker & web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use the example Wrangler config
        run: cp wrangler.example.jsonc wrangler.jsonc
      - name: Generate binding types
        run: npx wrangler types
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  cli:
    name: macOS CLI
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        working-directory: cli
        run: swift build -c release
