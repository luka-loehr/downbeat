name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  cli:
    name: Build macOS package
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build downbeat (universal)
        working-directory: cli
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package
        run: |
          set -e
          PKG=downbeat-macos-universal
          mkdir -p "$PKG"
          cp cli/.build/apple/Products/Release/downbeat "$PKG/downbeat"
          cp README.md LICENSE CHANGELOG.md "$PKG/"
          cat > "$PKG/install.sh" <<'INNER'
          #!/bin/sh
          # Installs the one binary Downbeat is.
          set -e
          HERE="$(cd "$(dirname "$0")" && pwd)"
          PREFIX="${PREFIX:-$( [ -w /usr/local/bin ] && echo /usr/local/bin || echo "$HOME/.local/bin" )}"
          mkdir -p "$PREFIX"
          install -m 755 "$HERE/downbeat" "$PREFIX/downbeat"
          rm -f "$PREFIX/downbeat-core"
          echo "Installed $PREFIX/downbeat. Next: downbeat login, then downbeat host"
          INNER
          chmod 755 "$PKG/install.sh"
          tar -czf "$PKG.tar.gz" "$PKG"
          shasum -a 256 "$PKG.tar.gz" > "$PKG.tar.gz.sha256"

      - name: Verify the packaged binary runs
        run: |
          tar -xzf downbeat-macos-universal.tar.gz -C /tmp
          /tmp/downbeat-macos-universal/downbeat version
          lipo -archs /tmp/downbeat-macos-universal/downbeat

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            downbeat-macos-universal.tar.gz
            downbeat-macos-universal.tar.gz.sha256
          body_path: CHANGELOG.md
          draft: false
